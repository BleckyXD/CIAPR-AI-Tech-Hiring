<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CIAPR AI Tech Hiring - Links</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --card-hover: #21262d;
      --border-color: #30363d;
      --text-main: #c9d1d9;
      --text-heading: #ffffff;
      --accent-color: #58a6ff;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 500px;
      padding: 2rem 1rem;
      text-align: center;
    }

    h1 {
      color: var(--text-heading);
      font-size: 1.75rem;
      margin-bottom: 0.5rem;
    }

    p {
      color: #8b949e;
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }

    .links-container {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .link-card {
      display: block;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1rem;
      color: var(--accent-color);
      text-decoration: none;
      font-weight: 600;
      font-size: 1.05rem;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .link-card:hover {
      background-color: var(--card-hover);
      border-color: #8b949e;
    }

    .link-card span {
      display: block;
      color: var(--text-main);
      font-weight: 400;
      font-size: 0.85rem;
      margin-top: 0.25rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>CIAPR-AI-Tech-Hiring</h1>
    <p>Personal portfolio and digital resume links</p>

    <div class="links-container">
      <!-- Link 1 -->
      <a href="https://github.com/BleckyXD" class="link-card" target="_blank" rel="noopener noreferrer">
        GitHub Profile
        <span>Direct link to my GitHub Repositories</span>
      </a>

      <!-- Link 2 -->
      <a href="https://www.linkedin.com/in/héctor-gabriel-santana-rosario" class="link-card" target="_blank" rel="noopener noreferrer">
        LinkedIn Profile
        <span>View my professional background & different activities</span>
      </a>

      <!-- Link to open the PDF in a new browser tab -->
      <a href="Resume.pdf" class="link-card" target="_blank" rel="noopener noreferrer">
        My Digital Resume (PDF)
        <span>Click to view or download my resume</span>
      </a>

    </div>
  </div>

</body>
</html>
